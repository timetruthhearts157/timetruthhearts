 <ul>
    {% assign sorted_pages = site.pages | sort: "last_modified_at" | reverse %}
    {% for item in sorted_pages %}
      {% if item.title and item.modified %}
        <li>
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
          <span>Updated: {{ item.modified | date: "%b %d, %Y" }}</span>
        </li>
      {% endif %}
    {% endfor %}
  </ul>
