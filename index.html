<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333;
    }
    h1 {
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .toc-list {
      list-style-type: none;
      padding-left: 0;
    }
    .toc-list li {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .page-link {
      font-weight: 600;
      color: #0366d6;
      text-decoration: none;
    }
    .page-link:hover {
      text-decoration: underline;
    }
    .modified-date {
      font-size: 0.85em;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>

  <h1>Works in Progress</h1>

 <ul class="toc-list">
  {% for item in site.pages %}
    {% if item.title and item.url != page.url %}
      <li>
        <a class="page-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% if item.last_modified_at %}
          <span class="modified-date">Updated: {{ item.last_modified_at | date: "%b %d, %Y" }}</span>
        {% endif %}
      </li>
    {% endif %}
  {% endfor %}
</ul>

</body>
</html>
